{% extends "base.html" %}

{% block title %}
Register | QuizVerse
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-logo">
            Q
        </div>

        <h2>
            Create Your Account
        </h2>

        <p class="text-muted">
            Start your technical learning journey with QuizVerse.
        </p>


        <form method="POST" class="mt-4">

            <div class="mb-3">

                <label class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Your full name"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Choose username"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-lg w-100"
            >
                Create Account →
            </button>

        </form>


        <p class="text-center text-muted mt-4 mb-0">

            Already registered?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
